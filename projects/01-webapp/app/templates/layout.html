<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <title>{% block title %}Todo App{% endblock title %}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark border-2 sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
            <img src="{{url_for('static',path='/img/logo.jpg')}}"
                alt="Todo APP",
                width="200px"  >
            </a>
            <div>
                {% if user %}
                    {% from 'create-task.html' import modal %}
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createtaskmodal" data-bs-whatever="@mdo">Crear Tarea</button>

                    <span class="text-light m-1">
                        Welcome {{user.username}}
                    </span>
                    <a href="/logout" class="btn btn-danger m-1">Logout</a>
                {% else %}
                    <a href="/auth" class="btn btn-success m-1">Login/Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% block script %}
    {% endblock script %}
    <script>
        const myModal = document.getElementById('createtaskmodal')
        const myInput = document.getElementById('myInput')

        myModal.addEventListener('shown.bs.modal', () => {
        myInput.focus()
        })
    </script>
</body>
</html>
