<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
    crossorigin="anonymous">
    <link rel="stylesheet"
        type="text/css"
        href="{{url_for('static',path='/css/styles.css')}}">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <title>{% block title %}Todo App{% endblock title %}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark border-2 sticky-top">
        <div class="container-fluid d-flex justify-content-between">
            <a class="navbar-brand" href="/">
            <img src="{{url_for('static',path='/img/logo.jpg')}}"
                alt="Todo APP",
                width="200px"  >
            </a>

            {% if user %}
            <span class="navbar-text text-white">
                Welcome {{user.full_name.split()[0]}}
            </span>
            <div class="dropdown d-inline">
                <button type="button"
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#createtaskmodal"
                        data-bs-whatever="@mdo">
                        Crear Tarea
                </button>
                <a class="btn btn-light" href="/profile">Mi perfil</a>
                <a class="btn btn-danger" href="/logout">Cerrar Sesión</a>
            </div>
            {% else %}
                <a href="/auth" class="btn btn-success m-1">Login/Register</a>
            {% endif %}

        </div>
    </nav>

    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="messageToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body text-white">
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% if user %}
        {% include 'add-task.html' %}
    {% endif %}

    {% block script %}
    {% endblock script %}
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        function showToast(message, type = 'success') {
            const toastElement = document.querySelector("#messageToast");
            const toastBody = toastElement.querySelector(".toast-body");

            // Limpiar clases anteriores
            toastElement.classList.remove('bg-success', 'bg-danger', 'bg-primary');

            // Configurar mensaje y estilo según el tipo
            toastBody.textContent = message;

            switch(type) {
                case 'error':
                    toastElement.classList.add('bg-danger');
                    break;
                case 'success':
                    toastElement.classList.add('bg-success');
                    break;
                case 'info':
                default:
                    toastElement.classList.add('bg-primary');
                    break;
            }

            const toast = new bootstrap.Toast(toastElement, {delay: 5000});
            toast.show();
        }

        // Verificar mensajes de éxito
        const msg = getCookie("msg");
        if (msg) {
            showToast(decodeURIComponent(msg), 'success');
            deleteCookie("msg");
        }

        // Verificar mensajes de error
        const errorMsg = getCookie("error_msg");
        if (errorMsg) {
            showToast(decodeURIComponent(errorMsg), 'error');
            deleteCookie("error_msg");
        }

        // Verificar mensajes informativos
        const infoMsg = getCookie("info_msg");
        if (infoMsg) {
            showToast(decodeURIComponent(infoMsg), 'info');
            deleteCookie("info_msg");
        }
    });
</script>

</body>
</html>
