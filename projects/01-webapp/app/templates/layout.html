{% import "macros.html" as macros %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <title>{% block title %}Todo App{% endblock title %}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark border-2 sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
            <img src="{{url_for('static',path='/img/logo.jpg')}}"
                alt="Todo APP",
                width="200px"  >
            </a>
            <div>
                {% if user %}
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createtaskmodal" data-bs-whatever="@mdo">Crear Tarea</button>
                    <div class="dropdown d-inline">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            Welcome {{user.username}}
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/profile">Mi Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">Cerrar Sesión</a></li>
                        </ul>
                    </div>
                {% else %}
                    <a href="/auth" class="btn btn-success m-1">Login/Register</a>
                    <a href="/login-azure" class="btn btn-primary m-1">
                        <img src="https://learn.microsoft.com/es-es/azure/active-directory/develop/media/howto-add-branding-in-azure-ad-apps/ms-symbollockup_mssymbol_19.png" alt="MS Logo" style="height: 20px; margin-right: 5px;">
                        Login with Microsoft
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% block script %}
    {% endblock script %}
    <script>
        const myModal = document.getElementById('createtaskmodal')
        const myInput = document.getElementById('myInput')

        myModal.addEventListener('shown.bs.modal', () => {
        myInput.focus()
        })
    </script>
</body>
</html>
