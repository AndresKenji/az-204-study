{% extends 'layout.html' %}

{% block title %}
    Login
{% endblock title %}

{% block content %}
<div class="d-flex justify-content-center align-content-center">

    <div class="card w-50 mt-5">
        <div class="card-header text-center">Login</div>
        <div class="card-body">


            <form method="POST" action="/auth">
            <div class="mb-3">
                <label for="username" class="form-label">UserName</label>
                <input type="text" class="form-control" id="username" name="username"  aria-describedby="userhelp">
            </div>

            <div class="mb-3">
                <label for="InputPassword" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="InputPassword">
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
        <div class="card-footer text-muted">
            <a href="register">Register?</a>
            <div class="text-center mt-3">
                <a href="/login-azure" class="btn btn-primary m-1">
                    <img src="https://learn.microsoft.com/es-es/azure/active-directory/develop/media/howto-add-branding-in-azure-ad-apps/ms-symbollockup_mssymbol_19.png" alt="MS Logo" style="height: 20px; margin-right: 5px;">
                    Login with Microsoft
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
