{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">Login</div>
        <div class="card-body">
            {% if msg %}
            {% if msg == 'Logout Successful' or 'User succesfuly created' %}
            <div class="alert alert-success" role="alert">{{msg}}</div>
            {% else %}
            <div class="alert alert-danger" role="alert">{{msg}}</div>
            {% endif %}
            {% endif %}

            <form method="POST" action="/auth">
            <div class="mb-3">
                <label for="username" class="form-label">UserName</label>
                <input type="text" class="form-control" id="username" aria-describedby="userhelp">
                <div id="userhelp" class="form-text">We'll never share your data with anyone else.</div>
            </div>

            <div class="mb-3">
                <label for="InputPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="InputPassword">
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
        <div class="card-footer text-muted">
            <a href="register">Register?</a>
        </div>
    </div>
</div>
